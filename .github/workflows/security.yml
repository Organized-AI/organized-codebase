# Security scanning on every pull request, every push to main and weekly. Modeled on
# Organized-AI/podcast-agent. CodeQL publishes to the Security tab; gitleaks, zizmor and dependency
# review fail the run on a finding. Every action is pinned to a commit SHA (the comment names the tag).
name: security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          category: /language:${{ matrix.language }}

  gitleaks:
    name: Secrets (gitleaks, full history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan every commit
        run: ./gitleaks git --redact --no-banner --exit-code 1 .

  zizmor:
    name: Workflows (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482  # v0.6.4
        with:
          advanced-security: false   # fail the job on any finding instead of only reporting it

  dependency-review:
    name: Dependency review
    # Also on dispatch: pull requests the changelog sync opens with GITHUB_TOKEN trigger no
    # workflows, so it dispatches this one against main instead.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0-only, AGPL-3.0-only
          # Accepted, reviewed exceptions. Each needs a reason and a way out; remove it when the way out lands.
          # GHSA-c475-qrg2-pj4r, basic-ftp 5.x (CPU DoS in FTP directory listing): reached only through
          # apify-client -> proxy-agent -> get-uri when a proxy is configured with an ftp:// URL, which
          # scripts/fetch-changelog.js never does. The fix is basic-ftp 6.x, outside get-uri's ^5 range.
          # Way out: get-uri allowing basic-ftp 6, or Dependabot proposing it.
          allow-ghsas: GHSA-c475-qrg2-pj4r
          base-ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || '' }}
          head-ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
