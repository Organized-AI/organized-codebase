# OpenSSF Scorecard: grades the repository's security practices (pinned actions, branch protection,
# token permissions, code review, SAST, dependency updates...) and publishes the score for the badge.
# publish_results only allows a restricted set of steps, so this job stays minimal.
# Copied from Organized-AI/podcast-agent.
name: scorecard
on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 2"
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write   # upload the SARIF to the Security tab
      id-token: write          # publish the results for the badge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: scorecard
          path: scorecard.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          sarif_file: scorecard.sarif
          category: scorecard
