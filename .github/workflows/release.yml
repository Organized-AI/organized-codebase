# Release on tag vX.Y.Z: the tag must be on main, main's PR Gate must have passed on that exact commit,
# and the tag, package.json and CHANGELOG.md must agree. Then the GitHub Release is published from the
# CHANGELOG.md section. Modeled on Organized-AI/podcast-agent's release.yml; this repository ships skills
# and templates, not an image, so there is nothing to re-tag and no environment to promote.
name: release
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Tag, gate, version and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: The PR Gate passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?check_name=PR%20Gate" \
            --jq '[.check_runs[] | .conclusion] | first // "missing"')
          echo "PR Gate on ${GITHUB_SHA::7}: $conclusion"
          [ "$conclusion" = "success" ]
      - name: Tag, package.json and CHANGELOG.md agree
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/ci/check-version.mjs --tag "$TAG"

  github-release:
    name: GitHub Release from CHANGELOG.md
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/ci/check-version.mjs --notes "$TAG" > notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --verify-tag --latest
