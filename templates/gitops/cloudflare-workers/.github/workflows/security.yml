name: security
# CodeQL and dependency review need GitHub Advanced Security, which private repositories only get on a paid plan.
# They run when the repository is public; npm audit of what ships runs everywhere.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Shipped dependencies (high and above fail)
        run: npm audit --omit=dev --audit-level=high
      - name: Dev toolchain (reported; Dependabot proposes the fixes)
        run: npm audit --audit-level=high || echo "::warning::npm audit found issues in dev dependencies (wrangler toolchain). Merge the Dependabot pull request for wrangler."

  codeql:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3

  dependency-review:
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
